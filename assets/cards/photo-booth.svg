<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modern Photobooth Kiosk &amp; Mobile Gallery">
  <style>
    .header { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #FF5370; }
    .desc { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #80CBC4; }
    .meta { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
    .link-text { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #FF5370; }
    .badge-bg { fill: rgba(255, 83, 112, 0.08); stroke: rgba(255, 83, 112, 0.25); }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="399" height="119" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Title & Repo Icon -->
  <g transform="translate(20, 18)">
    <svg x="0" y="0" viewBox="0 0 16 16" width="16" height="16" fill="#FF5370">
      <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
    </svg>
    <text x="24" y="13" class="header">photo-booth</text>
  </g>

  <!-- Description -->
  <text x="20" y="55" class="desc">
    <tspan x="20" dy="0">Hệ thống Photobooth chụp ảnh lấy liền &amp; Kiosk cảm ứng:</tspan>
    <tspan x="20" dy="17">Xử lý ghép khung tức thời &amp; phát hành album mã QR</tspan>
  </text>

  <!-- Footer Info -->
  <g transform="translate(20, 97)">
    <!-- Gin -->
    <circle cx="5" cy="5" r="4.5" fill="#00ADD8"/>
    <text x="14" y="9" class="meta">Gin</text>

    <!-- Next.js -->
    <circle cx="52" cy="5" r="4.5" fill="#0070F3"/>
    <text x="61" y="9" class="meta">Next.js</text>

    <!-- Live Deploy Link Badge -->
    <g transform="translate(195, -5)">
      <rect x="0" y="0" width="165" height="20" rx="4" class="badge-bg"/>
      <!-- External Link Icon -->
      <svg x="8" y="4" viewBox="0 0 16 16" width="12" height="12" fill="#FF5370">
        <path fill-rule="evenodd" d="M10.604 1h4.146a.25.25 0 01.25.25v4.146a.25.25 0 01-.427.177L13.03 4.03 9.28 7.78a.75.75 0 01-1.06-1.06l3.75-3.75-1.543-1.543A.25.25 0 0110.604 1zM3.75 2A1.75 1.75 0 002 3.75v8.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0014 12.25v-3.5a.75.75 0 00-1.5 0v3.5a.25.25 0 01-.25.25h-8.5a.25.25 0 01-.25-.25v-8.5a.25.25 0 01.25-.25h3.5a.75.75 0 000-1.5h-3.5z"/>
      </svg>
      <text x="24" y="14" class="link-text">photo.hcmutertic.com</text>
    </g>
  </g>
</svg>
