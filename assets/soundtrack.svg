<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="auto">
  <defs>
    <linearGradient id="wave-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#056BAC" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0070F3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="wave-spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#056BAC"/>
      <stop offset="35%" stop-color="#0070F3"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes c-wave-1 { 0%, 100% { height: 6px; y: 27px; } 50% { height: 42px; y: 9px; } }
    @keyframes c-wave-2 { 0%, 100% { height: 26px; y: 17px; } 50% { height: 8px; y: 26px; } }
    @keyframes c-wave-3 { 0%, 100% { height: 12px; y: 24px; } 50% { height: 46px; y: 7px; } }
    @keyframes c-wave-4 { 0%, 100% { height: 34px; y: 13px; } 50% { height: 12px; y: 24px; } }
    @keyframes c-wave-5 { 0%, 100% { height: 8px; y: 26px; } 50% { height: 36px; y: 12px; } }
    @keyframes c-wave-6 { 0%, 100% { height: 20px; y: 20px; } 50% { height: 44px; y: 8px; } }
    @keyframes c-wave-7 { 0%, 100% { height: 30px; y: 15px; } 50% { height: 8px; y: 26px; } }
    @keyframes c-wave-8 { 0%, 100% { height: 14px; y: 23px; } 50% { height: 40px; y: 10px; } }

    .w1 { animation: c-wave-1 1.1s ease-in-out infinite; }
    .w2 { animation: c-wave-2 0.85s ease-in-out infinite; }
    .w3 { animation: c-wave-3 1.3s ease-in-out infinite; }
    .w4 { animation: c-wave-4 0.95s ease-in-out infinite; }
    .w5 { animation: c-wave-5 1.2s ease-in-out infinite; }
    .w6 { animation: c-wave-6 0.78s ease-in-out infinite; }
    .w7 { animation: c-wave-7 1.05s ease-in-out infinite; }
    .w8 { animation: c-wave-8 1.15s ease-in-out infinite; }

    .equalizer {
      fill: url(#wave-spectrum);
    }
  </style>

  <!-- Outer Card Container -->
  <rect x="1" y="1" width="798" height="58" rx="8" fill="#0D1117" stroke="url(#wave-border)" stroke-width="1.2"/>

  <!-- Audio Waveform Visualizer spanning the entire card -->
  <g class="equalizer">
    <rect x="24" y="27" width="5" height="6" rx="2.5" class="w1" style="animation-delay: 0.0s;"/>
