<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="100%" height="auto">
  <defs>
    <linearGradient id="terminal-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#056BAC" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0070F3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>
  <style>
    .code { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 20px; }
    .title { font-family: 'Fira Code', ui-monospace, SFMono-Regular, monospace; font-size: 11px; fill: #8B949E; font-weight: 600; letter-spacing: 0.5px; }
    .k { fill: #00F0FF; font-weight: 600; }
    .s { fill: #A5D6FF; }
    .s-cyan { fill: #38BDF8; }
    .s-green { fill: #7EE787; }
    .s-blue { fill: #79C0FF; }
    .p { fill: #8B949E; }
    .user { fill: #00F0FF; font-weight: 700; }
    .host { fill: #38BDF8; font-weight: 600; }
    .path { fill: #7EE787; font-weight: 600; }
    .arrow { fill: #00F0FF; font-weight: 700; }
    .cmd { fill: #F0F6FC; }
    .pipe { fill: #38BDF8; font-weight: 700; }
    .tool { fill: #00F0FF; font-weight: 600; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #00F0FF; }
  </style>

  <!-- Outer Card with Cyan-Blue Gradient Border -->
  <rect x="1" y="1" width="578" height="268" rx="10" fill="#0D1117" stroke="url(#terminal-border)" stroke-width="1.5"/>

  <!-- Linux Terminal Window Header -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 567 1 A 10 10 0 0 1 579 11 L 579 34 L 1 34 Z" fill="url(#header-grad)"/>
  <line x1="1" y1="34" x2="567" y2="34" stroke="#30363D" stroke-width="1"/>

  <!-- Linux Custom Dots (Matching Cyan/Blue Palette) -->
  <circle cx="20" cy="17" r="5" fill="#056BAC"/>
  <circle cx="34" cy="17" r="5" fill="#0070F3"/>
  <circle cx="48" cy="17" r="5" fill="#00F0FF"/>

  <!-- Header Title: Custom Linux Terminal -->
  <text x="290" y="21" text-anchor="middle" class="title">🐧 datlmao@linux: ~/profile</text>

  <!-- Right Window Controls (Minimize / Maximize / Close) -->
  <g stroke="#8B949E" stroke-width="1.2" fill="none">
    <line x1="524" y1="20" x2="532" y2="20"/>
    <rect x="542" y="13" width="8" height="8" rx="1"/>
    <line x1="560" y1="13" x2="568" y2="21"/>
    <line x1="568" y1="13" x2="560" y2="21"/>
  </g>

  <!-- Terminal Command Prompt -->
  <text class="code" x="20" y="58">
    <tspan class="user">datlmao</tspan><tspan class="p">@</tspan><tspan class="host">linux</tspan><tspan class="p">:</tspan><tspan class="path">~/profile</tspan><tspan class="arrow"> ❯ </tspan><tspan class="cmd">curl -s https://api.github.com/users/t1endatj</tspan><tspan class="pipe"> | </tspan><tspan class="tool">jq</tspan>
  </text>

  <!-- JSON Body -->
  <text class="code" x="24" y="82">
    <tspan class="p">{</tspan>
  </text>
  <text class="code" x="40" y="104">
    <tspan class="k">"name"</tspan><tspan class="p">: </tspan><tspan class="s">"Nguyen Tien Dat"</tspan><tspan class="p">,</tspan>
  </text>
  <text class="code" x="40" y="126">
    <tspan class="k">"role"</tspan><tspan class="p">: </tspan><tspan class="s-cyan">"Fullstack Web Developer"</tspan><tspan class="p">,</tspan>
  </text>
  <text class="code" x="40" y="148">
    <tspan class="k">"location"</tspan><tspan class="p">: </tspan><tspan class="s-green">"Vietnam"</tspan><tspan class="p">,</tspan>
  </text>
  <text class="code" x="40" y="170">
    <tspan class="k">"specialties"</tspan><tspan class="p">: [</tspan><tspan class="s-blue">"Modern UI/UX"</tspan><tspan class="p">, </tspan><tspan class="s-blue">"Interactive Web"</tspan><tspan class="p">],</tspan>
  </text>
  <text class="code" x="40" y="192">
    <tspan class="k">"focus"</tspan><tspan class="p">: </tspan><tspan class="s">"Exploring &amp; using modern frontend libs"</tspan>
  </text>
  <text class="code" x="24" y="214">
    <tspan class="p">}</tspan>
  </text>

  <!-- Next Line Prompt with Blinking Cursor -->
  <text class="code" x="20" y="244">
    <tspan class="user">datlmao</tspan><tspan class="p">@</tspan><tspan class="host">linux</tspan><tspan class="p">:</tspan><tspan class="path">~/profile</tspan><tspan class="arrow"> ❯ </tspan><tspan class="cursor">▋</tspan>
  </text>
</svg>
