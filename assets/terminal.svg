<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="100%" height="auto">
  <defs>
    <linearGradient id="terminal-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2128"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
  </defs>
  <style>
    .code { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; line-height: 20px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8B949E; font-weight: 500; }
    .k { fill: #00F0FF; font-weight: 600; }
    .s { fill: #A5D6FF; }
    .s-green { fill: #7EE787; }
    .s-pink { fill: #FF7B72; }
    .s-purple { fill: #D2A8FF; }
    .s-yellow { fill: #E3B341; }
    .p { fill: #8B949E; }
    .prompt { fill: #7EE787; font-weight: 700; }
    .path { fill: #58A6FF; font-weight: 600; }
    .cmd { fill: #F0F6FC; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: blink 1s infinite; fill: #00F0FF; }
  </style>

  <!-- Outer Card with Gradient Border -->
  <rect x="1" y="1" width="538" height="328" rx="12" fill="#0D1117" stroke="url(#terminal-border)" stroke-width="1.5"/>

  <!-- Window Header -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 527 1 A 12 12 0 0 1 539 13 L 539 36 L 1 36 Z" fill="url(#header-grad)"/>
  <line x1="1" y1="36" x2="539" y2="36" stroke="#30363D" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="38" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="56" cy="18" r="6" fill="#27C93F"/>

  <!-- Header Title -->
  <text x="270" y="22" text-anchor="middle" class="title">datlmao@macbook ~ zsh</text>

  <!-- Terminal Content -->
  <text class="code" x="24" y="64">
    <tspan class="prompt">❯ </tspan><tspan class="path">~ </tspan><tspan class="cmd">cat profile.json</tspan>
  </text>

  <text class="code" x="24" y="92">
    <tspan class="p">{</tspan>
  </text>
  <text class="code" x="40" y="116">
    <tspan class="k">"name"</tspan><tspan class="p">: </tspan><tspan class="s">"Nguyen Tien Dat"</tspan><tspan class="p">,</tspan>
  </text>
  <text class="code" x="40" y="140">
    <tspan class="k">"role"</tspan><tspan class="p">: </tspan><tspan class="s-pink">"Web Developer"</tspan><tspan class="p">,</tspan>
  </text>
  <text class="code" x="40" y="164">
    <tspan class="k">"location"</tspan><tspan class="p">: </tspan><tspan class="s-green">"Vietnam 🇻🇳"</tspan><tspan class="p">,</tspan>
  </text>
  <text class="code" x="40" y="188">
    <tspan class="k">"specialties"</tspan><tspan class="p">: [</tspan><tspan class="s-yellow">"Frontend"</tspan><tspan class="p">, </tspan><tspan class="s-yellow">"Fullstack"</tspan><tspan class="p">, </tspan><tspan class="s-yellow">"Interactive UI"</tspan><tspan class="p">],</tspan>
  </text>
  <text class="code" x="40" y="212">
    <tspan class="k">"philosophy"</tspan><tspan class="p">: </tspan><tspan class="s">"The best interface is invisible."</tspan><tspan class="p">,</tspan>
  </text>
  <text class="code" x="40" y="236">
    <tspan class="k">"vibe"</tspan><tspan class="p">: </tspan><tspan class="s-purple">"Synthwave &amp; Lo-Fi Coding 🎧"</tspan>
  </text>
  <text class="code" x="24" y="260">
    <tspan class="p">}</tspan>
  </text>

  <!-- Next Line Prompt with Blinking Cursor -->
  <text class="code" x="24" y="292">
    <tspan class="prompt">❯ </tspan><tspan class="path">~ </tspan><tspan class="cursor">▋</tspan>
  </text>
</svg>
